name: Reality Bridge CI
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Materialize exact full Ultimate engine
        run: python archive/full-ultimate-engine/materialize.py
      - name: Check custom HTML JavaScript
        run: python tools/check_html_scripts.py
      - name: Test reusable JavaScript core
        run: node --test packages/reality-bridge-core/test/*.mjs
      - name: Compile-check Python bridge
        run: python -m py_compile native/python/live_bridge.py
      - name: Compile and run native C++ smoke test
        run: |
          g++ -std=c++20 native/cpp/reality_bridge_headless.cpp -o /tmp/reality_bridge_headless
          /tmp/reality_bridge_headless
