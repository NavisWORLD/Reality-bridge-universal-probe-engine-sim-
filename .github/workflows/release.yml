name: Reality Bridge Release Factory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']

permissions:
  contents: write

jobs:
  web-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Materialize and package web/source artifacts
        run: |
          python archive/full-ultimate-engine/materialize.py
          python - <<'PY'
          from pathlib import Path
          import shutil, zipfile
          out=Path('dist'); out.mkdir(exist_ok=True)
          shutil.copy2('REALITY_BRIDGE_UNIVERSE_ENGINE_ULTIMATE.html', out/'Reality-Bridge-Universe-Engine-v0.1.0.html')
          shutil.copy2('archive/full-ultimate-engine/REALITY_BRIDGE_UNIVERSE_ENGINE_ULTIMATE_FULL.html', out/'Reality-Bridge-Universe-Engine-FULL-v0.1.0.html')
          def bundle(name, paths):
              with zipfile.ZipFile(out/name,'w',zipfile.ZIP_DEFLATED) as z:
                  for p in map(Path,paths):
                      if p.is_dir():
                          for f in p.rglob('*'):
                              if f.is_file(): z.write(f,f.as_posix())
                      elif p.is_file(): z.write(p,p.as_posix())
          bundle('Reality-Bridge-PWA-v0.1.0.zip',['index.html','REALITY_BRIDGE_UNIVERSE_ENGINE_ULTIMATE.html','manifest.webmanifest','sw.js','icons','hardware'])
          bundle('Reality-Bridge-Hardware-CAD-v0.1.0.zip',['hardware','docs/DEVICE_BUILD_GUIDE.md','research/protocols/04_device_latency_accuracy.md'])
          bundle('Reality-Bridge-Source-v0.1.0.zip',['README.md','LICENSE','index.html','REALITY_BRIDGE_UNIVERSE_ENGINE_ULTIMATE.html','archive','docs','hardware','native','packages','apps','research'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: web-source
          path: dist/*
          if-no-files-found: error

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build Windows installer and portable EXE
        shell: pwsh
        run: |
          cd apps/desktop
          npm install --no-audit --no-fund
          npm run sync:web
          npx electron-builder --win nsis portable --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: apps/desktop/dist/*.exe
          if-no-files-found: error

  desktop-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build unsigned macOS DMG and app ZIP
        run: |
          cd apps/desktop
          npm install --no-audit --no-fund
          npm run sync:web
          CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac dmg zip --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
          if-no-files-found: error

  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build Linux AppImage
        run: |
          cd apps/desktop
          npm install --no-audit --no-fund
          npm run sync:web
          npx electron-builder --linux AppImage --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: apps/desktop/dist/*.AppImage
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate and build Android app
        run: |
          cd apps/mobile
          npm install --no-audit --no-fund
          npm run sync:web
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          mkdir -p ../../../dist-android
          cp app/build/outputs/apk/debug/app-debug.apk ../../../dist-android/Reality-Bridge-Universe-v0.1.0-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist-android/*.apk
          if-no-files-found: error

  ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Generate and build unsigned iOS Simulator app
        run: |
          cd apps/mobile
          npm install --no-audit --no-fund
          npm run sync:web
          npx cap add ios
          npx cap sync ios
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO
          cd build/Build/Products/Release-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent App.app ../../../../../Reality-Bridge-Universe-v0.1.0-iOS-Simulator.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: apps/mobile/Reality-Bridge-Universe-v0.1.0-iOS-Simulator.app.zip
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [web-source, desktop-windows, desktop-macos, desktop-linux, android, ios-simulator]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify required release assets
        run: |
          set -euo pipefail
          find release-assets -maxdepth 2 -type f -printf '%p\n' | sort
          test -n "$(find release-assets -iname '*.exe' -print -quit)"
          test -n "$(find release-assets -iname '*.dmg' -print -quit)"
          test -n "$(find release-assets -iname '*.AppImage' -print -quit)"
          test -n "$(find release-assets -iname '*.apk' -print -quit)"
          test -n "$(find release-assets -iname '*iOS-Simulator*.zip' -print -quit)"
          test -f release-assets/Reality-Bridge-PWA-v0.1.0.zip
          test -f release-assets/Reality-Bridge-Hardware-CAD-v0.1.0.zip
          test -f release-assets/Reality-Bridge-Universe-Engine-v0.1.0.html
          test -f release-assets/Reality-Bridge-Universe-Engine-FULL-v0.1.0.html
      - name: Generate SHA-256 checksums and release notes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('release-assets')
          lines=[]
          for p in sorted(x for x in root.iterdir() if x.is_file()):
              lines.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}")
          (root/'SHA256SUMS.txt').write_text('\n'.join(lines)+'\n')
          PY
          cat > RELEASE_NOTES.md <<'EOF'
          # Reality Bridge Universe Engine v0.1.0

          Full-disclosure engineering release containing the playable Universe Engine, interactive Reality Bridge probe/digital twin, blueprint/CAD/firmware package, native and reusable source, and cross-platform application packages.

          ## Distribution notes
          - Windows packages are unsigned unless a publisher certificate is configured; Windows may show an unknown-publisher warning.
          - macOS DMG/app ZIP is intentionally unsigned/not notarized unless Apple distribution credentials are configured; Gatekeeper may warn.
          - Android APK is a debug-signed installable development APK for direct testing, not a Play Store production signature.
          - iOS artifact is an unsigned **Simulator** `.app.zip`. Physical-device, TestFlight, and App Store installs require legitimate Apple Developer signing/provisioning.
          - The HTTPS PWA is the no-Apple-signing install route for iPhone/iPad and also works on Android/desktop browsers.
          - Reference probe hardware remains a DESIGN TARGET until the published qualification protocol is actually run.
          EOF
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view v0.1.0 >/dev/null 2>&1; then
            gh release upload v0.1.0 release-assets/* --clobber
          else
            gh release create v0.1.0 release-assets/* --target "$GITHUB_SHA" --title "Reality Bridge Universe Engine v0.1.0" --notes-file RELEASE_NOTES.md
          fi
